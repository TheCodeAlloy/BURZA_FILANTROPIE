<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrace — Burza filantropie</title>
  <style>
    /* Veřejný formulář: vlídný, klidný, dobře ovladatelný na mobilu.
       Jiný vizuál než konzole (ta je pracovní nástroj) — tohle je přívětivá
       veřejná stránka. Teplejší, uvítací tón, velká klikací pole. */
    :root {
      --akcent: #3a7563;
      --akcent-tmavy: #2c5a4c;
      --plocha: #f2f5f3;
      --text: #24302b;
      --text-slaby: #5f6f68;
      --linka: #d9e2dd;
      --chyba: #b3261e;
      --chyba-plocha: #fdecea;
      --ok: #1e7d4f;
      --ok-plocha: #e7f4ec;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--plocha);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .karta {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      margin-top: 24px;
    }
    .hlava {
      background: var(--akcent);
      color: #fff;
      padding: 32px 32px 26px;
    }
    .hlava h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .hlava p { opacity: 0.9; font-size: 15px; }
    .telo { padding: 28px 32px 32px; }

    .pole { margin-bottom: 20px; }
    .pole label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 7px;
      color: var(--text);
    }
    .pole input, .pole select {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px; /* 16px = na mobilu nezvětšuje zoom */
      border: 1.5px solid var(--linka);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }
    .pole input:focus, .pole select:focus {
      outline: none;
      border-color: var(--akcent);
      box-shadow: 0 0 0 3px rgba(58,117,99,0.14);
    }

    .radek-dve { display: flex; gap: 14px; }
    .radek-dve .pole { flex: 1; }

    .btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--akcent);
      color: #fff;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn:hover:not(:disabled) { background: var(--akcent-tmavy); }
    .btn:disabled { opacity: 0.6; cursor: default; }

    .hlaska { padding: 14px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 15px; }
    .hlaska-chyba { background: var(--chyba-plocha); color: var(--chyba); }
    .hlaska-ok { background: var(--ok-plocha); color: var(--ok); }

    .stav-zavreno, .stav-hotovo {
      text-align: center;
      padding: 20px 0;
    }
    .stav-hotovo .ikona { font-size: 48px; margin-bottom: 12px; }
    .stav-hotovo h2 { font-size: 20px; margin-bottom: 10px; color: var(--ok); }
    .stav-hotovo p { color: var(--text-slaby); }

    .nacitani { text-align: center; padding: 40px 0; color: var(--text-slaby); }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--linka);
      border-top-color: var(--akcent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .skryto { display: none !important; }
  </style>
</head>
<body>
  <div class="karta">
    <div class="hlava">
      <h1>Registrace do Burzy filantropie</h1>
      <p>Přihlaste svou organizaci a projekt do aktuálního kola.</p>
    </div>
    <div class="telo">

      <!-- Načítání -->
      <div id="stavNacitani" class="nacitani">
        <div class="spinner"></div>
        Načítám…
      </div>

      <!-- Registrace zavřené -->
      <div id="stavZavreno" class="stav-zavreno skryto">
        <div class="hlaska hlaska-chyba" style="text-align:left;">
          Registrace nejsou momentálně otevřené. Zkuste to prosím později.
        </div>
      </div>

      <!-- Formulář -->
      <form id="formular" class="skryto" onsubmit="return false;">
        <div id="hlaska" class="hlaska skryto"></div>

        <div class="pole">
          <label for="ic">IČ organizace</label>
          <input id="ic" inputmode="numeric" autocomplete="off" placeholder="12345678">
        </div>

        <div class="pole">
          <label for="nazev">Název organizace</label>
          <input id="nazev" autocomplete="organization" placeholder="Název vaší organizace">
        </div>

        <div class="radek-dve">
          <div class="pole">
            <label for="okres">Okres</label>
            <select id="okres">
              <option value="">— vyberte —</option>
            </select>
          </div>
          <div class="pole">
            <label for="typ">Typ prezentace</label>
            <select id="typ">
              <option value="">— vyberte —</option>
              <option value="typ A">Typ A</option>
              <option value="typ B">Typ B</option>
            </select>
          </div>
        </div>

        <div class="pole">
          <label for="email">E-mailová adresa</label>
          <input id="email" type="email" autocomplete="email" placeholder="kontakt@organizace.cz">
        </div>

        <div class="pole">
          <label for="projekt">Název projektu</label>
          <input id="projekt" autocomplete="off" placeholder="Název projektu">
        </div>

        <button id="btnOdeslat" class="btn">Odeslat registraci</button>
      </form>

      <!-- Hotovo -->
      <div id="stavHotovo" class="stav-hotovo skryto">
        <div class="ikona">✓</div>
        <h2>Registrace odeslána</h2>
        <p>Děkujeme. Potvrzení jsme poslali na váš e-mail. O výsledku posouzení
           vás budeme informovat.</p>
      </div>

    </div>
  </div>

  <script>
    // ⚠ SEM VLOŽ URL veřejného API (Projekt B) po jeho nasazení:
    const API_URL = 'SEM_VLOZ_URL_VEREJNEHO_API';

    // Načtení dat pro formulář (okresy, stav registrace).
    nactiData();

    function nactiData() {
      fetch(API_URL)
        .then(r => r.json())
        .then(data => {
          ukazStav('nic');
          if (!data.otevreno) {
            ukazStav('zavreno');
            return;
          }
          naplnOkresy(data.okresy);
          ukazStav('formular');
        })
        .catch(err => {
          ukazStav('zavreno');
          console.error(err);
        });
    }

    function naplnOkresy(okresy) {
      const select = document.getElementById('okres');
      (okresy || []).forEach(o => {
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o;
        select.appendChild(opt);
      });
    }

    function ukazStav(stav) {
      document.getElementById('stavNacitani').classList.add('skryto');
      document.getElementById('stavZavreno').classList.add('skryto');
      document.getElementById('formular').classList.add('skryto');
      document.getElementById('stavHotovo').classList.add('skryto');
      if (stav === 'zavreno')   document.getElementById('stavZavreno').classList.remove('skryto');
      if (stav === 'formular')  document.getElementById('formular').classList.remove('skryto');
      if (stav === 'hotovo')    document.getElementById('stavHotovo').classList.remove('skryto');
    }

    // Odeslání registrace.
    document.getElementById('btnOdeslat').onclick = odesli;

    function odesli() {
      const data = {
        ic:               document.getElementById('ic').value.trim(),
        nazev_organizace: document.getElementById('nazev').value.trim(),
        okres:            document.getElementById('okres').value,
        email:            document.getElementById('email').value.trim(),
        nazev_projektu:   document.getElementById('projekt').value.trim(),
        typ_prezentace:   document.getElementById('typ').value
      };

      // Kontrola vyplnění.
      for (const k in data) {
        if (!data[k]) { zobrazChybu('Vyplňte prosím všechna pole.'); return; }
      }
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email);
      if (!emailOk) { zobrazChybu('Zadejte platnou e-mailovou adresu.'); return; }

      const btn = document.getElementById('btnOdeslat');
      btn.disabled = true;
      btn.textContent = 'Odesílám…';
      skryjHlasku();

      // CORS: posíláme jako text/plain, aby prohlížeč neposílal preflight.
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ akce: 'registrace', data: data })
      })
        .then(r => r.json())
        .then(odpoved => {
          btn.disabled = false;
          btn.textContent = 'Odeslat registraci';
          if (odpoved.success) {
            ukazStav('hotovo');
          } else {
            zobrazChybu(odpoved.message || 'Registraci se nepodařilo odeslat.');
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.textContent = 'Odeslat registraci';
          zobrazChybu('Došlo k chybě spojení. Zkuste to prosím znovu.');
          console.error(err);
        });
    }

    function zobrazChybu(text) {
      const h = document.getElementById('hlaska');
      h.className = 'hlaska hlaska-chyba';
      h.textContent = text;
      h.classList.remove('skryto');
    }
    function skryjHlasku() {
      document.getElementById('hlaska').classList.add('skryto');
    }
  </script>
</body>
</html>
